name: Interactive Marimo QA/QC Gatekeeper CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  marimo-dashboard-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenBIM & Marimo Stack
        run: |
          python -m pip install --upgrade pip
          pip install "bimpolars[ifc] @ git+https://github.com/bedrock-engineer/bimpolars.git" ifcopenshell ifctester polars marimo

      - name: Execute Marimo Reactive Cells & Export HTML Snapshot
        run: |
          python generate_sample_ifc.py
          python generate_sample_ids.py
          marimo export html qa_dashboard.py -o qa_dashboard_snapshot.html

      - name: Upload Rendered HTML Dashboard Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: marimo-qa-dashboard-html
          path: qa_dashboard_snapshot.html
